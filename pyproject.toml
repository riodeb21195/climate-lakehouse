[project]
name = "climate-lakehouse"
version = "0.1.0"
description = "Medallion lakehouse on Iceberg for German daily climate observations since 1950"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs Docker (testcontainers)"]

[tool.coverage.run]
source = ["climate_lakehouse"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
