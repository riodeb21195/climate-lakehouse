# Damit der Test-Stack neben einem Entwickler-Stack läuft: zufällige Host-Ports, keine festen.
services:
  seaweedfs:
    ports: !override ["8333"]
  lakekeeper:
    ports: !reset []
  # Die Job-Tests starten die Jobs direkt; Airflow deckt test_dag.py ab.
  airflow-init: &off
    profiles: ["airflow"]
  airflow-api-server: *off
  airflow-scheduler: *off
  airflow-dag-processor: *off
