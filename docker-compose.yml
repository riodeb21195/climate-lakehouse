# Memory limits keep the whole stack inside a ~4.8 GiB Docker VM (see README, "Speicherbudget").
name: climate-lakehouse

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  RUST_LOG: info

# Airflow and the jobs share one image (docker/Dockerfile).
x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: ${IMAGE:-climate-lakehouse:local}
  env_file:
    - path: .env
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 1
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # Local stack only: every visitor of the UI is admin, no login (README, "Grenzen")
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API__WORKERS: 1
    STATION_LIMIT: ${STATION_LIMIT:-50}
    START_YEAR: ${START_YEAR:-1950}
    ALERT_CHANNEL: ${ALERT_CHANNEL:-log}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    S3_BUCKET: ${S3_BUCKET}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    WAREHOUSE: ${WAREHOUSE}
    # Inside the Docker network; .env holds the host-side addresses
    S3_ENDPOINT: http://seaweedfs:8333
    CATALOG_URI: http://lakekeeper:8181/catalog
    SPARK_DRIVER_MEMORY: 1536m
  volumes:
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    # Upload and read buffers capped so that Spark's parallel writes fit the memory limit
    command:
      - mini
      - -dir=/data
      - -s3.concurrentUploadLimitMB=64
      - -filer.concurrentUploadLimitMB=64
      - -volume.concurrentUploadLimitMB=64
      - -s3.readerCacheSizeMB=64
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      retries: 20
    # 256m without buffer caps was OOM-killed while bronze wrote the 50-station sample;
    # with caps it peaked at 380 MiB during an Airflow run (2026-10-29)
    mem_limit: 512m
    restart: unless-stopped

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.2
    environment: *lakekeeper-env
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.2
    environment: *lakekeeper-env
    command: ["serve"]
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      retries: 10
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    mem_limit: 128m

  lakekeeper-bootstrap:
    image: curlimages/curl:8.23.0
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      WAREHOUSE: ${WAREHOUSE}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/lakekeeper-bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"
    mem_limit: 32m

  # Orchestration. The scheduler runs the tasks itself (LocalExecutor), so the Spark driver of
  # a job lives in the scheduler container: one job at a time, see the DAG.
  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  airflow-api-server:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 20
      start_period: 30s
    depends_on: &after-init
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 640m

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *after-init
      # Tasks report to the Execution API; started earlier, the first task was killed.
      airflow-api-server:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    mem_limit: 2560m

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on: *after-init
    mem_limit: 384m

  # Single jobs on demand (make bronze, ...): same image, without Airflow.
  jobs:
    <<: *airflow
    entrypoint: ["/opt/climate/.venv/bin/python", "-m"]
    command: ["climate_lakehouse.transform.reconcile"]
    profiles: ["jobs"]
    restart: "no"
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    mem_limit: 2g

volumes:
  postgres-data:
  seaweedfs-data:
  airflow-logs:
