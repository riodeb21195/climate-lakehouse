# Die Speicherlimits halten den ganzen Stack in einer Docker-VM mit ~4,8 GiB
# (siehe docs/architecture.md, "Speicherbudget").
name: climate-lakehouse

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  RUST_LOG: info

# Airflow und die Jobs teilen sich ein Image (docker/Dockerfile).
x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: ${IMAGE:-climate-lakehouse:local}
  env_file:
    - path: .env
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 1
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # Nur für den lokalen Stack: Jeder Besucher der UI ist Admin, ohne Login
    # (docs/design-decisions.md, "Grenzen")
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API__WORKERS: 1
    STATION_LIMIT: ${STATION_LIMIT:-50}
    START_YEAR: ${START_YEAR:-1950}
    ALERT_CHANNEL: ${ALERT_CHANNEL:-log}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    S3_BUCKET: ${S3_BUCKET}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    WAREHOUSE: ${WAREHOUSE}
    # Im Docker-Netz; die .env enthält die Adressen vom Host aus
    S3_ENDPOINT: http://seaweedfs:8333
    CATALOG_URI: http://lakekeeper:8181/catalog
    SPARK_DRIVER_MEMORY: 1536m
  volumes:
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    # Upload- und Lesepuffer begrenzt, damit Sparks parallele Schreibvorgänge ins Limit passen
    command:
      - mini
      - -dir=/data
      - -s3.concurrentUploadLimitMB=64
      - -filer.concurrentUploadLimitMB=64
      - -volume.concurrentUploadLimitMB=64
      - -s3.readerCacheSizeMB=64
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      retries: 20
    # Mit 256m ohne Pufferlimits per OOM beendet, als Bronze die 50 Stationen schrieb;
    # mit Limits lag die Spitze bei 380 MiB während eines Airflow-Laufs (2026-10-29)
    mem_limit: 512m
    restart: unless-stopped

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.2
    environment: *lakekeeper-env
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.2
    environment: *lakekeeper-env
    command: ["serve"]
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      retries: 10
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    mem_limit: 128m

  lakekeeper-bootstrap:
    image: curlimages/curl:8.23.0
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      WAREHOUSE: ${WAREHOUSE}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/lakekeeper-bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"
    mem_limit: 32m

  # Orchestrierung. Der Scheduler führt die Tasks selbst aus (LocalExecutor), der Spark-Driver
  # eines Jobs läuft also im Scheduler-Container: ein Job zur Zeit, siehe DAG.
  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  airflow-api-server:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 20
      start_period: 30s
    depends_on: &after-init
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 640m

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *after-init
      # Tasks melden sich bei der Execution API; früher gestartet, wurde der erste Task beendet.
      airflow-api-server:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    mem_limit: 2560m

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on: *after-init
    mem_limit: 384m

  # Einzelne Jobs bei Bedarf (make bronze, ...): dasselbe Image, ohne Airflow.
  jobs:
    <<: *airflow
    entrypoint: ["/opt/climate/.venv/bin/python", "-m"]
    command: ["climate_lakehouse.transform.reconcile"]
    profiles: ["jobs"]
    restart: "no"
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    mem_limit: 2g

  # Dashboard, bei Bedarf gestartet (make dashboard). DuckDB in Superset liest Gold direkt.
  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    image: climate-lakehouse-superset:local
    profiles: ["dashboard"]
    command:
      - bash
      - -c
      - >-
        superset db upgrade
        && superset fab create-admin --username admin --firstname Admin --lastname Local
        --email admin@localhost --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        && superset init
        && /usr/bin/run-server.sh
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WAREHOUSE: ${WAREHOUSE}
      SERVER_THREADS_AMOUNT: 8
    ports:
      - "8088:8088"
    volumes:
      - superset-home:/app/superset_home
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 10s
      retries: 30
      start_period: 60s
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1g

volumes:
  postgres-data:
  seaweedfs-data:
  airflow-logs:
  superset-home:
