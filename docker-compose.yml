# Memory limits keep the whole stack inside a ~4.8 GiB Docker VM (see README, "Speicherbudget").
name: climate-lakehouse

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  RUST_LOG: info

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      retries: 20
    mem_limit: 256m

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.2
    environment: *lakekeeper-env
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.2
    environment: *lakekeeper-env
    command: ["serve"]
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      retries: 10
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    mem_limit: 128m

  lakekeeper-bootstrap:
    image: curlimages/curl:8.23.0
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      WAREHOUSE: ${WAREHOUSE}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/lakekeeper-bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"
    mem_limit: 32m

  # Batch jobs, started on demand: docker compose run --rm spark python -m <module>
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: climate-lakehouse-spark:local
    profiles: ["jobs"]
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the Docker network; .env holds the host-side addresses
      S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_URI: http://lakekeeper:8181/catalog
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      WAREHOUSE: ${WAREHOUSE}
      SPARK_DRIVER_MEMORY: 1536m
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    mem_limit: 2g

volumes:
  postgres-data:
  seaweedfs-data:
